name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dbt DuckDB adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Install dbt packages
        run: dbt deps --profiles-dir .github/dbt-profiles

      - name: Offline Google measurement normalization tests
        run: python -m unittest discover -s tests -p 'test_google_measurement*.py' -v

      - name: Validate first-party GA4 lab event query contracts without credentials
        run: python -m unittest discover -s tests -p 'test_lab_ga4_events.py' -v

      - name: Verify keyless GA4 impersonation does not leak credentials
        run: python -m unittest discover -s tests -p 'test_ga4_keyless_auth.py' -v

      - name: Parse project (validates all SQL and YAML)
        run: dbt parse --profiles-dir .github/dbt-profiles

      - name: Compile channel, product and funnel analytical SQL
        run: dbt compile --profiles-dir .github/dbt-profiles --select analyses/

      - name: Load seed data (57 sample rows across 4 tables)
        run: dbt seed --profiles-dir .github/dbt-profiles

      - name: Run all 10 models (staging + intermediate + marts)
        run: dbt run --profiles-dir .github/dbt-profiles

      - name: Run 57 data quality tests (model layer only)
        run: dbt test --profiles-dir .github/dbt-profiles --exclude "source:*"

      - name: Export historical E-Commerce marts (synthetic CI only, read-only)
        run: python -m scripts.ecommerce_marts_bridge --db target/ci.duckdb --provenance synthetic_ci

  google-dashboard-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install open-source dashboard dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Build reproducible native NEXUS Power BI PBIP and verify source isolation
        run: |
          python -m unittest discover -s tests -p 'test_build_powerbi.py' -v
          python -m scripts.build_powerbi --out target/powerbi
          python -m scripts.powerbi_acceptance --output target/powerbi/desktop_qa.json
          python -m unittest discover -s tests -p 'test_powerbi_structure_audit.py' -v
          python -m scripts.powerbi_structure_audit --out target/powerbi

      - name: Static Python correctness check for NEXUS core, dashboard and integration
        run: |
          python -m pip install 'ruff>=0.10,<1'
          ruff check --select E9,F821,F822,F823 scripts/build_powerbi.py scripts/powerbi_structure_audit.py scripts/verify_offline_pipeline.py dashboard/google_marketing_app.py dashboard/greenweez_finance.py tests/smoke_google_marketing_app.py

      - name: Compile dashboard source
        run: python -m py_compile dashboard/google_marketing_app.py dashboard/greenweez_finance.py scripts/google_dashboard_data.py scripts/lab_ga4_events.py scripts/greenweez_bridge.py scripts/ecommerce_marts_bridge.py dashboard/ecommerce_historical.py scripts/nexus_workspace.py scripts/greenweez_sheets_observed.py scripts/greenweez_import_audit.py dashboard/greenweez_sheets.py dashboard/nexus_theme.py scripts/ga4_property_preflight.py scripts/powerbi_acceptance.py scripts/build_powerbi.py

      - name: Validate local Chrome Lighthouse JSON parser
        run: python -m unittest discover -s tests -p 'test_local_lighthouse.py' -v

      - name: Verify Greenweez source-separated DuckDB bridge and finance reconciliation
        run: python -m unittest discover -s tests -p 'test_greenweez_bridge.py' -v

      - name: Validate historical E-Commerce mart aggregation and source isolation
        run: python -m unittest discover -s tests -p 'test_ecommerce_marts_bridge.py' -v

      - name: Enforce single NEXUS repository identity and no Greenweez upstream links
        run: python -m unittest discover -s tests -p 'test_single_repo_identity.py' -v

      - name: Validate nine-source NEXUS audit and staged source publishing
        run: python -m unittest discover -s tests -p 'test_nexus_workspace.py' -v

      - name: Validate private Greenweez import audit and PBIP evidence
        run: python -m unittest discover -s tests -p 'test_greenweez_import_audit.py' -v

      - name: Validate ID-free Google Sheets source evidence and finance caveats
        run: python -m unittest discover -s tests -p 'test_greenweez_sheets_observed.py' -v

      - name: Validate owned GA4 property resolution without network
        run: python -m unittest discover -s tests -p 'test_ga4_property_preflight.py' -v

      - name: Verify two-project BigQuery inventory is metadata-only and token-safe
        run: python -m unittest discover -s tests -p 'test_cloud_source_*.py' -v

      - name: Validate zero-row historical E-Commerce BigQuery preflight
        run: python -m unittest discover -s tests -p 'test_ecommerce_bigquery_preflight.py' -v

      - name: Validate metadata-only P0 source readiness without BigQuery queries
        run: python -m unittest discover -s tests -p 'test_cloud_source_readiness.py' -v

      - name: Reject Git-tracked credential files and raw source database artifacts
        run: |
          python -m unittest discover -s tests -p 'test_repo_hygiene_guard.py' -v
          python -m scripts.repo_hygiene_guard

      - name: Test safe bulk repair for NEXUS WIF provider variables (offline)
        run: python -m unittest discover -s tests -p 'test_repair_nexus_wif_provider.py' -v

      - name: Guard keyless no-row BigQuery connectivity contracts
        run: python -m unittest discover -s tests -p 'test_bigquery_connection_probe.py' -v

      - name: Guard real Greenweez BigQuery load behind unique sources and query bounds
        run: python -m unittest discover -s tests -p 'test_greenweez_bq_loader.py' -v

      - name: Validate NEXUS design tokens and Power BI honesty gates
        run: |
          python -m unittest discover -s tests -p 'test_nexus_design_powerbi.py' -v
          python -m scripts.powerbi_acceptance --output target/powerbi_acceptance.json

      - name: Validate original NEXUS logo, Streamlit favicon and storefront identity
        run: python -m unittest discover -s tests -p 'test_nexus_brand.py' -v

      - name: Inspect GA4 API preflight without credentials or network
        run: python -m scripts.ga4_property_preflight

      - name: Audit NEXUS source empty-state without credentials
        run: python -m scripts.nexus_workspace status --json

      - name: Run Streamlit empty-state and verified-test-source smoke checks
        run: python -m unittest discover -s tests -p 'smoke_google_marketing_app.py' -v

  commerce-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check static storefront JavaScript syntax
        run: |
          node --check storefront/core.mjs
          node --check storefront/tracking.mjs
          node --check storefront/app.mjs
          node --check storefront/scripts/build.mjs

      - name: Test cart, event contracts and analytics consent
        run: node --test storefront/tests/*.test.mjs

      - name: Build public static bundle without analytics
        run: |
          node storefront/scripts/build.mjs
          test -f storefront/dist/index.html
          test -f storefront/dist/app.mjs
          test -f storefront/dist/config.js
          test -s storefront/dist/favicon.svg
          test -s storefront/dist/nexus-logo.png
          cmp branding/nexus_official_transparent.png storefront/nexus-logo.png
          cmp branding/nexus_official_transparent.png storefront/dist/nexus-logo.png
          grep -Fq 'rel="icon" type="image/svg+xml"' storefront/dist/index.html
          grep -Fq 'ga4MeasurementId: ""' storefront/dist/config.js
          grep -Fq 'NO REAL PAYMENTS' storefront/dist/index.html

      - name: Verify approved public GA4 Measurement ID is build-only
        env:
          NEXUS_GA4_MEASUREMENT_ID: G-ABC123456
        run: |
          node storefront/scripts/build.mjs
          grep -Fq 'ga4MeasurementId: "G-ABC123456"' storefront/dist/config.js

  greenweez-dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout E-Commerce including consolidated Greenweez project
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Greenweez standalone dbt adapter
        run: pip install 'dbt-core~=1.11.0' 'dbt-duckdb~=1.10.0'

      - name: Install Greenweez pinned dbt-utils
        working-directory: integrations/greenweez
        run: dbt deps --profiles-dir .github/dbt-profiles

      - name: Seed Greenweez synthetic raw tables
        working-directory: integrations/greenweez
        run: dbt seed --profiles-dir .github/dbt-profiles --target ci

      - name: Build & test Greenweez finance and campaign marts independently
        working-directory: integrations/greenweez
        run: dbt build --profiles-dir .github/dbt-profiles --target ci --exclude resource_type:seed

      - name: Greenweez full dbt marts-to-NEXUS bridge acceptance
        run: |
          python -m scripts.greenweez_bridge --db integrations/greenweez/target/ci.duckdb --provenance synthetic_demo
          python -m unittest discover -s tests -p 'test_greenweez_bridge.py' -v

      - name: Build Greenweez Google Sheets-shaped synthetic mode
        working-directory: integrations/greenweez
        run: |
          dbt seed --profiles-dir .github/dbt-profiles --target gsheet
          dbt build --profiles-dir .github/dbt-profiles --target gsheet --vars '{source_system: fvt_gsheet}' --selector fvt_gsheet --indirect-selection cautious --exclude resource_type:seed

      - name: Verify fvt_gsheet finance marts also satisfy E-Commerce bridge
        run: python -m scripts.greenweez_bridge --db integrations/greenweez/target/gsheet.duckdb --provenance synthetic_demo --output target/greenweez_bridge/gsheet_synthetic.json

  offline-integration-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout both source-scoped dbt projects
        uses: actions/checkout@v5

      - name: Set up Python for credential-free integration
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install DuckDB dbt, source adapters, and PBIP dependencies
        run: |
          python -m pip install 'dbt-core~=1.11.0' 'dbt-duckdb~=1.10.0'
          python -m pip install -r dashboard/requirements.txt

      - name: Build root historical E-Commerce synthetic marts
        run: |
          dbt deps --profiles-dir .github/dbt-profiles
          dbt seed --profiles-dir .github/dbt-profiles
          dbt run --profiles-dir .github/dbt-profiles
          dbt test --profiles-dir .github/dbt-profiles --exclude "source:*"

      - name: Build nested Greenweez synthetic finance marts
        working-directory: integrations/greenweez
        run: |
          dbt deps --profiles-dir .github/dbt-profiles
          dbt seed --profiles-dir .github/dbt-profiles --target ci
          dbt build --profiles-dir .github/dbt-profiles --target ci --exclude resource_type:seed

      - name: Import both synthetic dbt snapshots with isolated provenance
        run: |
          python -m scripts.nexus_workspace import \
            --ecommerce-db target/ci.duckdb --ecommerce-origin synthetic_ci \
            --greenweez-db integrations/greenweez/target/ci.duckdb \
            --greenweez-origin synthetic_demo

      - name: Audit dbt to NEXUS to Power BI PBIP end to end
        run: |
          python -m unittest discover -s tests -p 'test_offline_integration.py' -v
          python -m scripts.verify_offline_pipeline --root . --out target/powerbi
