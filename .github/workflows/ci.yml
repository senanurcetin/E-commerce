name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dbt DuckDB adapter
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Install dbt packages
        run: dbt deps --profiles-dir .github/dbt-profiles

      - name: Offline Google measurement normalization tests
        run: python -m unittest discover -s tests -p 'test_google_measurement*.py' -v

      - name: Parse project (validates all SQL and YAML)
        run: dbt parse --profiles-dir .github/dbt-profiles

      - name: Compile channel, product and funnel analytical SQL
        run: dbt compile --profiles-dir .github/dbt-profiles --select analyses/

      - name: Load seed data (57 sample rows across 4 tables)
        run: dbt seed --profiles-dir .github/dbt-profiles

      - name: Run all 10 models (staging + intermediate + marts)
        run: dbt run --profiles-dir .github/dbt-profiles

      - name: Run 57 data quality tests (model layer only)
        run: dbt test --profiles-dir .github/dbt-profiles --exclude "source:*"

  google-dashboard-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install open-source dashboard dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Compile dashboard source
        run: python -m py_compile dashboard/google_marketing_app.py scripts/google_dashboard_data.py

      - name: Run Streamlit empty-state and verified-test-source smoke checks
        run: python -m unittest discover -s tests -p 'smoke_google_marketing_app.py' -v
