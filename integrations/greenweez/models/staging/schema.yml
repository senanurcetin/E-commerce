version: 2

sources:
  - name: raw
    description: >
      Raw Greenweez dataset. On BigQuery it is the real `gwz_raw_data` dataset;
      on the DuckDB targets (ci, demo) the same table names are served by the
      synthetic seeds in `seeds/`.
    database: "{{ 'workintech-working' if target.type == 'bigquery' else target.database }}"
    schema: "{{ 'gwz_raw_data' if target.type == 'bigquery' else target.schema }}"
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Raw sales transactions data."
        config:
          loaded_at_field: "cast(date_date as timestamp)"
          freshness:
            warn_after: {count: 90, period: day}
        columns:
          - name: date_date
            description: "Transaction date."
          - name: orders_id
            description: "Order identifier."
          - name: pdt_id
            description: "Product identifier in the raw sales table."
          - name: revenue
            description: "Revenue generated by the order line."
          - name: quantity
            description: "Quantity sold."

      - name: product
        identifier: raw_gz_product
        description: "Raw product reference data."
        columns:
          - name: products_id
            description: "Product identifier."
          - name: purchse_PRICE
            description: "Raw purchase price column (the misspelling is in the source)."

      - name: ship
        identifier: raw_gz_ship
        description: "Raw shipping cost data."
        columns:
          - name: orders_id
            description: "Order identifier."
          - name: shipping_fee
            description: "Shipping fee charged to the customer. This is the column used downstream."
          - name: shipping_fee_1
            description: >
              Alternative shipping fee column kept in the raw table for comparison.
              It is intentionally not used by any model.
          - name: logCost
            description: "Logistics cost."
          - name: ship_cost
            description: "Shipping cost."

      - name: adwords
        identifier: raw_gz_adwords
        description: "Raw Google Adwords campaign performance data."
        config:
          loaded_at_field: "cast(date_date as timestamp)"
          freshness:
            warn_after: {count: 90, period: day}
        columns:
          - name: date_date
            description: "Campaign performance date."
          - name: paid_source
            description: "Paid media source."
          - name: campaign_key
            description: "Campaign identifier."
          - name: camPGN_name
            description: "Raw campaign name field."
          - name: ads_cost
            description: "Advertising cost stored in raw format."
          - name: impression
            description: "Number of ad impressions."
          - name: click
            description: "Number of ad clicks."
      - name: bing
        identifier: raw_gz_bing
        description: "Raw Bing campaign performance data."
        config:
          loaded_at_field: "cast(date_date as timestamp)"
          freshness:
            warn_after: {count: 90, period: day}
        columns:
          - name: date_date
            description: "Campaign performance date."
          - name: paid_source
            description: "Paid media source."
          - name: campaign_key
            description: "Campaign identifier."
          - name: camPGN_name
            description: "Raw campaign name field."
          - name: ads_cost
            description: "Advertising cost stored in raw format."
          - name: impression
            description: "Number of ad impressions."
          - name: click
            description: "Number of ad clicks."
      - name: criterio
        identifier: raw_gz_criterio
        description: "Raw Criteo campaign performance data."
        config:
          loaded_at_field: "cast(date_date as timestamp)"
          freshness:
            warn_after: {count: 90, period: day}
        columns:
          - name: date_date
            description: "Campaign performance date."
          - name: paid_source
            description: "Paid media source."
          - name: campaign_key
            description: "Campaign identifier."
          - name: camPGN_name
            description: "Raw campaign name field."
          - name: ads_cost
            description: "Advertising cost stored in raw format."
          - name: impression
            description: "Number of ad impressions."
          - name: click
            description: "Number of ad clicks."
      - name: facebook
        identifier: raw_gz_facebook
        description: "Raw Facebook campaign performance data."
        config:
          loaded_at_field: "cast(date_date as timestamp)"
          freshness:
            warn_after: {count: 90, period: day}
        columns:
          - name: date_date
            description: "Campaign performance date."
          - name: paid_source
            description: "Paid media source."
          - name: campaign_key
            description: "Campaign identifier."
          - name: camPGN_name
            description: "Raw campaign name field."
          - name: ads_cost
            description: "Advertising cost stored in raw format."
          - name: impression
            description: "Number of ad impressions."
          - name: click
            description: "Number of ad clicks."

models:
  - name: stg_raw__sales
    description: "Cleaned sales data from raw source (one row per order line)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [orders_id, products_id]
    columns:
      - name: date_date
        description: "Transaction date."
        tests:
          - not_null
      - name: orders_id
        description: "Order identifier."
        tests:
          - not_null
      - name: products_id
        description: "Renamed product identifier from pdt_id."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_raw__product')
                field: products_id
              config:
                severity: warn
      - name: revenue
        description: "Revenue amount."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: quantity
        description: "Sold quantity."

  - name: stg_raw__product
    description: "Cleaned product data from raw source."
    columns:
      - name: products_id
        description: "Product identifier."
        tests:
          - unique
          - not_null
      - name: purchase_price
        description: "Renamed and cast purchase price."

  - name: stg_raw__ship
    description: >
      Cleaned shipping data from raw source. `shipping_fee` is kept;
      `shipping_fee_1` (alternative raw column) is not used.
    columns:
      - name: orders_id
        description: "Order identifier."
        tests:
          - unique
          - not_null
      - name: shipping_fee
        description: "Shipping fee charged to the customer."
      - name: log_cost
        description: "Logistics cost."
      - name: ship_cost
        description: "Shipping cost."

  - name: stg_raw__adwords
    description: "Cleaned Google Adwords campaign data with standardized column names and types (built by the `stg_ads_source` macro)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_date, paid_source, campaign_key]
    columns:
      - name: date_date
        description: "Campaign performance date."
        tests:
          - not_null
      - name: paid_source
        description: "Advertising source name."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['adwords', 'bing', 'criteo', 'facebook']
              config:
                severity: warn
      - name: campaign_key
        description: "Campaign identifier."
        tests:
          - not_null
      - name: campaign_name
        description: "Renamed campaign name from camPGN_name."
      - name: ads_cost
        description: "Advertising cost (numeric)."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: impression
        description: "Number of impressions."
      - name: click
        description: "Number of clicks."

  - name: stg_raw__bing
    description: "Cleaned Bing campaign data with standardized column names and types (built by the `stg_ads_source` macro)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_date, paid_source, campaign_key]
    columns:
      - name: date_date
        description: "Campaign performance date."
        tests:
          - not_null
      - name: paid_source
        description: "Advertising source name."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['adwords', 'bing', 'criteo', 'facebook']
              config:
                severity: warn
      - name: campaign_key
        description: "Campaign identifier."
        tests:
          - not_null
      - name: campaign_name
        description: "Renamed campaign name from camPGN_name."
      - name: ads_cost
        description: "Advertising cost (numeric)."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: impression
        description: "Number of impressions."
      - name: click
        description: "Number of clicks."

  - name: stg_raw__criteo
    description: "Cleaned Criteo campaign data with standardized column names and types (built by the `stg_ads_source` macro)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_date, paid_source, campaign_key]
    columns:
      - name: date_date
        description: "Campaign performance date."
        tests:
          - not_null
      - name: paid_source
        description: "Advertising source name."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['adwords', 'bing', 'criteo', 'facebook']
              config:
                severity: warn
      - name: campaign_key
        description: "Campaign identifier."
        tests:
          - not_null
      - name: campaign_name
        description: "Renamed campaign name from camPGN_name."
      - name: ads_cost
        description: "Advertising cost (numeric)."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: impression
        description: "Number of impressions."
      - name: click
        description: "Number of clicks."

  - name: stg_raw__facebook
    description: "Cleaned Facebook campaign data with standardized column names and types (built by the `stg_ads_source` macro)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date_date, paid_source, campaign_key]
    columns:
      - name: date_date
        description: "Campaign performance date."
        tests:
          - not_null
      - name: paid_source
        description: "Advertising source name."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['adwords', 'bing', 'criteo', 'facebook']
              config:
                severity: warn
      - name: campaign_key
        description: "Campaign identifier."
        tests:
          - not_null
      - name: campaign_name
        description: "Renamed campaign name from camPGN_name."
      - name: ads_cost
        description: "Advertising cost (numeric)."
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: impression
        description: "Number of impressions."
      - name: click
        description: "Number of clicks."
