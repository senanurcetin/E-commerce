<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Greenweez — finance and campaign analytics architecture</title><desc id="desc">Conceptual analytical data lineage for transaction and paid-campaign modeling, not a chart of company financial results.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09201F"/><stop offset="1" stop-color="#174740"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#C0EDCF" opacity=".15"/></pattern></defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#dots)"/>
