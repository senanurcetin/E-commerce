<text x="54" y="171" font-family="Arial,sans-serif" font-size="59" font-weight="700" fill="#FFFFFF">Finance meets</text>
<text x="54" y="236" font-family="Arial,sans-serif" font-size="59" font-weight="700" fill="#B8F5CD">campaign analytics.</text>
<text x="56" y="299" font-family="Arial,sans-serif" font-size="21" fill="#C2DCD2">Unify transactional finance and paid-channel</text>
<text x="56" y="329" font-family="Arial,sans-serif" font-size="21" fill="#C2DCD2">activity into reproducible reporting marts.</text>
