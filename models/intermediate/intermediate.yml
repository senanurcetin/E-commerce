version: 2

models:
  - name: int_orders_enriched
    description: Combined dataset of order items, products, and users for sales analysis.
    columns:
      - name: order_item_id
        description: Unique identifier for each order item.
        tests:
          - not_null
          - unique

      - name: order_id
        description: Identifier for the order.

      - name: user_id
        description: User who placed the order.

      - name: product_id
        description: Product included in the order.

      - name: order_item_status
        description: Current status of the order item.

      - name: sale_price
        description: Sale price of the product.
        tests:
          - not_null

      - name: order_item_created_at
        description: Timestamp when the order item was created.
        tests:
          - not_null

      - name: order_item_shipped_at
        description: Timestamp when the order item was shipped.

      - name: order_item_delivered_at
        description: Timestamp when the order item was delivered.

      - name: order_item_returned_at
        description: Timestamp when the order item was returned.

      - name: product_name
        description: Original product name from the source product table.

      - name: category
        description: Product category.

      - name: brand
        description: Product brand.

      - name: department
        description: Product department.

      - name: retail_price
        description: Retail price of the product.

      - name: cost
        description: Cost of the product.

      - name: gender
        description: Gender of the user.

      - name: age
        description: Age of the user.

      - name: country
        description: Country of the user.

      - name: traffic_source
        description: Order-level traffic source attributed from the nearest purchase event for the same user, falling back to signup source when needed.

  - name: int_events_enriched
    description: >
      Event stream prepared for session analysis, at event grain. User attributes
      are joined in the marts layer against dim_user rather than here, so this
      model neither widens the largest table in the project nor carries direct
      identifiers into a queryable view.
    columns:
      - name: event_id
        description: Unique identifier for each event.
        tests:
          - not_null
          - unique

      - name: user_id
        description: User who triggered the event. Null for anonymous traffic.

      - name: session_id
        description: Session identifier grouping consecutive events by one user.

      - name: sequence_number
        description: Position of the event within the user's event stream, used to order first-touch attribution.

      - name: event_created_at
        description: Timestamp of the event, in UTC.

      - name: ip_address
        description: Client IP address from the source event. Personal data, not carried into the marts layer.

      - name: city
        description: City resolved from the event, or 'unknown'.

      - name: state
        description: State or region resolved from the event, or 'unknown'.

      - name: postal_code
        description: Postal code resolved from the event, or 'unknown'.

      - name: browser
        description: Browser used during the event, lowercased, or 'unknown'.

      - name: traffic_source
        description: Acquisition source recorded on the event, or 'unknown'. Session-level source, distinct from the signup source on dim_user.

      - name: page_uri
        description: Page path visited during the event.

      - name: event_type_raw
        description: Raw event label from the source system, before normalization.

      - name: event_type
        description: Normalized event type used for funnel analysis.
